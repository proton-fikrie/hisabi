# Nginx Configuration for Hisabi Laravel + React App
# Optimized for ultra-low memory usage

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

# Upstream PHP-FPM
upstream php-fpm {
    server unix:/run/php/php8.2-fpm.sock max_fails=3 fail_timeout=30s;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    
    server_name _;  # Accept any hostname
    
    root /var/www/hisabi/public;
    index index.php index.html;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Gzip compression - save bandwidth
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;
    gzip_min_length 256;
    
    # Brotli compression (if available)
    # brotli on;
    # brotli_comp_level 4;
    # brotli_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
    
    # Client body size
    client_max_body_size 10M;
    client_body_buffer_size 128k;
    
    # Timeouts
    proxy_connect_timeout 30s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    fastcgi_connect_timeout 30s;
    fastcgi_send_timeout 30s;
    fastcgi_read_timeout 30s;
    
    # Logging
    access_log /var/log/nginx/hisabi-access.log combined buffer=32k flush=5s;
    error_log /var/log/nginx/hisabi-error.log warn;
    
    # Health check endpoint (for monitoring)
    location /up {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # Static assets - React build files
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri $uri/ =404;
    }
    
    # Additional static files
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        log_not_found off;
        access_log off;
    }
    
    # Laravel storage (uploaded files)
    location ^~ /storage/ {
        alias /var/www/hisabi/storage/app/public/;
        try_files $uri $uri/ =404;
        expires 7d;
        add_header Cache-Control "public";
    }
    
    # API routes with rate limiting
    location ^~ /api/ {
        limit_req zone=api burst=20 nodelay;
        
        try_files $uri $uri/ /index.php?$query_string;
    }
    
    # Auth endpoints with stricter rate limiting
    location ~ ^/(login|register|forgot-password|reset-password) {
        limit_req zone=login burst=5 nodelay;
        
        try_files $uri $uri/ /index.php?$query_string;
    }
    
    # PHP files handling
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php-fpm;
        fastcgi_index index.php;
        include fastcgi_params;
        
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTP_PROXY "";
        
        # Buffer settings for low memory
        fastcgi_buffer_size 32k;
        fastcgi_buffers 4 32k;
        fastcgi_busy_buffers_size 64k;
        
        # Timeouts
        fastcgi_connect_timeout 30s;
        fastcgi_send_timeout 30s;
        fastcgi_read_timeout 30s;
        
        # Keep connection alive
        fastcgi_keep_conn on;
    }
    
    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Deny access to sensitive files
    location ~* \.(env|gitignore|gitattributes|lock)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Deny access to Laravel specific paths
    location ~ ^/(app|bootstrap|config|database|resources|routes|storage|tests|vendor) {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Main location block - Laravel front controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
        
        # Proper handling of React Router / Laravel routes
        location ~ ^/index\.php$ {
            fastcgi_pass php-fpm;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTP_PROXY "";
            
            fastcgi_buffer_size 32k;
            fastcgi_buffers 4 32k;
            fastcgi_busy_buffers_size 64k;
        }
    }
    
    # Error pages
    error_page 404 /index.php;
    error_page 403 /index.php;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}

