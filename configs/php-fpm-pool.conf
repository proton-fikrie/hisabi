; PHP-FPM Pool Configuration for Hisabi
; Optimized for ultra-low memory usage (<512MB total system)

[www]
; User and group
user = www-data
group = www-data

; Socket configuration - faster than TCP, lower overhead
listen = /run/php/php8.2-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Process manager - dynamic for memory efficiency
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

; Memory limit per child (critical for <512MB total)
php_admin_value[memory_limit] = 128M

; Request timeout
request_terminate_timeout = 30s

; Environment variables
env[HOSTNAME] = $HOSTNAME
env[PATH] = /usr/local/bin:/usr/bin:/bin
env[TMP] = /tmp
env[TMPDIR] = /tmp
env[TEMP] = /tmp

; PHP configuration overrides for pool
php_admin_value[upload_max_filesize] = 10M
php_admin_value[post_max_size] = 10M
php_admin_value[max_execution_time] = 30
php_admin_value[max_input_time] = 30
php_admin_value[max_input_vars] = 1000
php_admin_value[realpath_cache_size] = 4M
php_admin_value[realpath_cache_ttl] = 120

; Error handling
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/hisabi/php-fpm-error.log

; Security
php_admin_flag[expose_php] = off
php_admin_flag[allow_url_fopen] = off
php_admin_flag[allow_url_include] = off

; Opcache settings (set in main php.ini, referenced here)
; Ensure opcache is enabled for performance
php_admin_flag[opcache.enable] = on
php_admin_flag[opcache.enable_cli] = on

; Disable dangerous functions
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,curl_exec,curl_multi_exec,parse_ini_file,show_source

; Slow log for debugging slow requests
slowlog = /var/log/hisabi/php-fpm-slow.log
request_slowlog_timeout = 10s

; Access log (optional - disable in production to save I/O)
; access.log = /var/log/hisabi/php-fpm-access.log

; Catch workers output
catch_workers_output = yes
decorate_workers_output = no

; Emergency restart threshold
emergency_restart_threshold = 10
emergency_restart_interval = 1m
process_control_timeout = 10s
