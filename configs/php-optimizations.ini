; PHP Optimizations for Hisabi - Ultra Low Memory
; Place in: /etc/php/8.2/fpm/conf.d/99-optimizations.ini
;           /etc/php/8.2/cli/conf.d/99-optimizations.ini

; ========== Memory Management ==========
memory_limit = 128M
max_execution_time = 30
max_input_time = 30
max_input_vars = 1000
max_file_uploads = 5
upload_max_filesize = 10M
post_max_size = 10M

; ========== Opcache Configuration ==========
; Essential for Laravel performance on low-end hardware
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 64
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 4000
opcache.revalidate_freq = 60
opcache.fast_shutdown = 1
opcache.save_comments = 1
opcache.optimization_level = 0xFFFFFFFF
opcache.jit_buffer_size = 32M
opcache.jit = tracing

; ========== Realpath Cache ==========
realpath_cache_size = 4M
realpath_cache_ttl = 120

; ========== File Uploads ==========
file_uploads = On
upload_tmp_dir = /tmp

; ========== Error Handling ==========
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/hisabi/php-error.log

; ========== Session Configuration ==========
session.gc_probability = 1
session.gc_divisor = 100
session.gc_maxlifetime = 1440
session.save_handler = files
session.save_path = /var/www/hisabi/storage/framework/sessions
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1
session.use_only_cookies = 1

; ========== Security ==========
expose_php = Off
allow_url_fopen = Off
allow_url_include = Off
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,curl_exec,curl_multi_exec,parse_ini_file,show_source

; ========== Resource Limits ==========
max_execution_time = 30
max_input_time = 30
max_input_nesting_level = 64
max_input_vars = 1000

; ========== Output Buffering ==========
output_buffering = 4096
implicit_flush = Off
zlib.output_compression = Off

; ========== Timezone ==========
date.timezone = UTC

; ========== SQLite Specific ==========
sqlite3.extension_dir = /usr/lib/php/20220829/

; ========== Performance Tweaks ==========
; Don't check file modification on every request (production)
opcache.validate_timestamps = 0

; Preload for faster startup (Laravel optimization)
; Uncomment after initial setup if memory allows
; opcache.preload = /var/www/hisabi/preload.php
; opcache.preload_user = www-data
