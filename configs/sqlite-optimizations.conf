# SQLite Optimization Configuration for Hisabi
# Apply these settings via PRAGMA commands or in application code

## ============================================
## ESSENTIAL PRAGMAS (Apply Once at DB Creation)
## ============================================

# WAL Mode (Write-Ahead Logging) - Critical for concurrent access
# Allows readers to not block writers and vice versa
PRAGMA journal_mode = WAL;

# Synchronous mode - NORMAL is a good balance between safety and speed
# FULL = safest but slowest, OFF = fastest but risk corruption on crash
PRAGMA synchronous = NORMAL;

# Page size - 4KB matches most OS page sizes
PRAGMA page_size = 4096;

# Auto-vacuum - Incremental to prevent database bloat
PRAGMA auto_vacuum = INCREMENTAL;

## ============================================
## MEMORY OPTIMIZATION PRAGMAS
## ============================================

# Cache size - Negative value = pages, Positive = bytes
# -8192 = 8192 pages * 4096 bytes = 32MB cache
PRAGMA cache_size = -8192;

# Temporary storage - MEMORY for faster temp operations
PRAGMA temp_store = MEMORY;

# Memory-mapped I/O - Allows OS to manage caching
# 256MB mmap size for good performance
PRAGMA mmap_size = 268435456;

## ============================================
## QUERY OPTIMIZATION PRAGMAS
## ============================================

# Enable foreign key constraints (Laravel usually handles this)
PRAGMA foreign_keys = ON;

# Query planner settings
PRAGMA query_only = OFF;
PRAGMA cell_size_check = OFF;  # Disable in production for speed

# Enable load extension if needed for additional functionality
# PRAGMA load_extension;

## ============================================
## MAINTENANCE COMMANDS (Run Periodically)
## ============================================

# Optimize the database (reclaims space, defragments)
PRAGMA optimize;
PRAGMA incremental_vacuum;

# Analyze tables for better query planning
ANALYZE;

# Check integrity (run periodically or after crashes)
PRAGMA integrity_check;
PRAGMA foreign_key_check;

## ============================================
## LARAVEL CONFIGURATION (config/database.php)
## ============================================

/*
'sqlite' => [
    'driver' => 'sqlite',
    'url' => env('DATABASE_URL'),
    'database' => env('DB_DATABASE', database_path('database.sqlite')),
    'prefix' => '',
    'foreign_key_constraints' => env('DB_FOREIGN_KEYS', true),
    'busy_timeout' => 5000,  // Wait up to 5 seconds for locks
    'journal_mode' => 'WAL',
    'synchronous' => 'NORMAL',
],
*/

## ============================================
## CONNECTION SETTINGS FOR PDO/LARAVEL
## ============================================

# When opening the connection, execute these PRAGMAs:

PRAGMA_FOREIGN_KEYS = "PRAGMA foreign_keys = ON"
PRAGMA_JOURNAL_MODE = "PRAGMA journal_mode = WAL"
PRAGMA_SYNCHRONOUS = "PRAGMA synchronous = NORMAL"
PRAGMA_CACHE_SIZE = "PRAGMA cache_size = -8192"
PRAGMA_TEMP_STORE = "PRAGMA temp_store = MEMORY"
PRAGMA_MMAP_SIZE = "PRAGMA mmap_size = 268435456"

## ============================================
## BACKUP STRATEGY
## ============================================

# SQLite backup is just copying the file!
# But with WAL mode, need to checkpoint first:

# Online backup (safe while app is running):
PRAGMA wal_checkpoint(TRUNCATE);
# Then copy the .sqlite file

# Or use SQLite's backup API:
# sqlite3 hisabi.sqlite ".backup '/backup/hisabi-backup.sqlite'"

## ============================================
## MONITORING QUERIES
## ============================================

# Check current settings:
PRAGMA journal_mode;
PRAGMA synchronous;
PRAGMA cache_size;
PRAGMA mmap_size;
PRAGMA wal_checkpoint;

# Check database size and page count:
PRAGMA page_count;
PRAGMA freelist_count;
PRAGMA page_size;

# Check WAL file size:
# ls -lh /var/lib/sqlite/hisabi.sqlite-wal

## ============================================
## EMERGENCY RECOVERY
## ============================================

# If database is locked or corrupted:
# 1. Stop the application
# 2. Delete WAL files (will lose uncommitted transactions):
#    rm /var/lib/sqlite/hisabi.sqlite-wal
#    rm /var/lib/sqlite/hisabi.sqlite-shm
# 3. Run recovery:
#    sqlite3 /var/lib/sqlite/hisabi.sqlite ".recover"
# 4. Or restore from backup

## ============================================
## FILE PERMISSIONS
## ============================================

# Database files should be writable by www-data:
# chown www-data:www-data /var/lib/sqlite/hisabi.sqlite
# chmod 664 /var/lib/sqlite/hisabi.sqlite

# Directory permissions:
# chmod 750 /var/lib/sqlite
